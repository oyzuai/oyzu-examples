name: Examples verification

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact candidate Oyzu release tag (otherwise the configured pin)'
        type: string
      release_asset:
        description: 'Candidate asset name; required together with a candidate tag and SHA-256'
        type: string
      release_sha256:
        description: 'Candidate artifact SHA-256; required together with tag and asset'
        type: string
      release_executable:
        description: 'Relative executable path in the candidate archive (default oyzu)'
        type: string

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog structure
    runs-on: ubuntu-24.04
    outputs:
      recipes: ${{ steps.affected.outputs.recipes }}
      required_external_recipes: ${{ steps.affected.outputs.required_external_recipes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node verification/catalog.mjs
      - run: node --test verification/*.test.mjs
      - id: affected
        env:
          EXAMPLES_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node verification/affected.mjs
  native:
    name: Native examples (${{ matrix.recipe }})
    needs: catalog
    if: needs.catalog.outputs.recipes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.catalog.outputs.recipes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Acquire the selected published Oyzu artifact
        env:
          GH_TOKEN: ${{ github.token }}
          OYZU_RELEASE_TAG: ${{ inputs.release_tag || vars.OYZU_RELEASE_TAG }}
          OYZU_RELEASE_ASSET: ${{ inputs.release_tag && inputs.release_asset || vars.OYZU_RELEASE_ASSET }}
          OYZU_RELEASE_SHA256: ${{ inputs.release_tag && inputs.release_sha256 || vars.OYZU_RELEASE_SHA256 }}
          OYZU_RELEASE_EXECUTABLE: ${{ inputs.release_tag && inputs.release_executable || vars.OYZU_RELEASE_EXECUTABLE }}
          EXAMPLES_CANDIDATE_TAG: ${{ inputs.release_tag }}
          EXAMPLES_CANDIDATE_ASSET: ${{ inputs.release_asset }}
          EXAMPLES_CANDIDATE_SHA256: ${{ inputs.release_sha256 }}
        run: |
          if [ -n "$EXAMPLES_CANDIDATE_TAG$EXAMPLES_CANDIDATE_ASSET$EXAMPLES_CANDIDATE_SHA256" ]; then
            test -n "$EXAMPLES_CANDIDATE_TAG" && test -n "$EXAMPLES_CANDIDATE_ASSET" && test -n "$EXAMPLES_CANDIDATE_SHA256" || { echo '::error::Supply the complete candidate tag, asset and checksum tuple'; exit 1; }
          fi
          node verification/install-cli.mjs
      - name: Build and consume the committed native recipe
        env:
          EXAMPLES_RECIPE: ${{ matrix.recipe }}
        run: node verification/verify.mjs "$EXAMPLES_RECIPE" "$OYZU_CLI" ".oyzu/verification/$EXAMPLES_RECIPE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-${{ matrix.recipe }}
          path: .oyzu/verification/*.json
  notify-docs:
    needs: [catalog, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.native.result == 'success' && needs.catalog.outputs.required_external_recipes == '[]'
    runs-on: ubuntu-24.04
    steps:
      - name: Mint a repository-scoped dispatch token for this run
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.OYZU_EXAMPLES_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.OYZU_EXAMPLES_DISPATCH_APP_PRIVATE_KEY }}
          owner: oyzuai
          repositories: oyzu
          permission-contents: write
      - name: Request a reviewable pin update after verified native changes
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          EXAMPLES_COMMIT: ${{ github.sha }}
          EXAMPLES_RECIPES: ${{ needs.catalog.outputs.recipes }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::Configure the separate dispatch App client ID and private key for oyzuai/oyzu'; exit 1; }
          jq -n --arg commit "$EXAMPLES_COMMIT" --argjson recipes "$EXAMPLES_RECIPES" '{event_type:"examples-verified",client_payload:{commit:$commit,recipes:$recipes}}' | gh api repos/oyzuai/oyzu/dispatches --input -
