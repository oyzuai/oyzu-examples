[tools]
node = "22.23.3"
npm = "11.11.0"

[env]
GREETING_MODE = "local"

[profiles.preview.env]
GREETING_MODE = "preview"

[tasks.verify_input]
argv = ["node", "tasks.mjs", "verify"]

[tasks.pre_build]
argv = ["node", "tasks.mjs", "prepare"]
depends_on = ["verify_input"]
outputs = ["generated.json"]

[tasks.post_build]
argv = ["node", "tasks.mjs", "check"]
